  for (var j=0; j<4; j++) { if (counts[j] > max) { max = counts[j]; idx = j; } }

}

function render() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

function renderQuiz() {
  var idx = answers.length;

  html += '</div>';
  app.innerHTML = html;
  var btns = app.querySelectorAll('.opt');
  for (var j=0; j<btns.length; j++) {
    btns[j].onclick = function() {
      answers.push(parseInt(this.getAttribute('data-i')));
      if (answers.length >= questions.length) { resultIdx = getResultIndex(); screen = 'loading'; render(); }
      else { screen = 'quiz'; render(); }
    };
  }
}

  timerInterval = setInterval(function() {
    var diff = Math.max(0, end - Date.now());
    var h = String(Math.floor(diff/3600000)).padStart(2,'0');
    var m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
    var s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
    var el = document.getElementById('timer');
    if (el) el.textContent = '⏰ Oferta valida por: ' + h + ':' + m + ':' + s;
    else clearInterval(timerInterval);
  }, 1000);
}

render();
</script>
</body>
</html>
